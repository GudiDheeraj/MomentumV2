# =============================================================================
# Momentum Tracker — static frontend
# =============================================================================
# This replaces `python -m http.server`, which was serving 2.1MB of JavaScript
# and CSS uncompressed, one request at a time, with no cache headers:
#
#   app.js             539K  ->  144K gzipped
#   styles.css         284K  ->   60K gzipped
#   pdf.min.js         298K  ->   82K gzipped
#   pdf.worker.min.js 1005K  ->  273K gzipped
#
# http.server is single-threaded, so those four requests also queued behind
# each other rather than overlapping. Compression and concurrency together are
# the largest single latency fix available to this app.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No extra `types` block here on purpose. Whether nginx's bundled
    # mime.types already maps .mjs varies by version, and declaring an
    # extension twice is a startup error, not a warning — a frontend that
    # refuses to boot is a worse outcome than the problem it would solve.
    # pdf.js is vendored as .js anyway (see vendor/pdfjs/README.txt).

    access_log off;               # a static file server logging every asset is just noise
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Writable paths, so the container can run without root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- compression --------------------------------------------------------
    gzip on;
    gzip_vary on;                 # so a shared cache doesn't hand a gzipped body to a client that can't read it
    gzip_min_length 1024;         # below this the header costs more than the saving
    gzip_comp_level 6;            # 6 is the knee of the curve; 9 costs noticeably more CPU for ~1% less
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf;

    server {
        listen 5173;
        server_name _;
        root /app/frontend;
        index index.html;

        # ---- the entry document must never be cached ------------------------
        # styles.css and app.js carry a ?v= token, but the browser only learns
        # a new token by re-reading this file. A cached index.html therefore
        # pins the whole app to an old build — which is what previously made a
        # series of fixes look like they never landed.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }
        location = / {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        # env.js is regenerated from .env on every container start, so it is
        # exactly as cacheable as index.html: not at all.
        location = /env.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        # ---- versioned assets: cache hard -----------------------------------
        # app.js and styles.css are always requested with ?v=<build token>, so
        # a new build is a new URL and an old one can be kept indefinitely.
        # `immutable` additionally stops the browser revalidating on reload.
        location ~* \.(?:js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # Vendored libraries never change without their path changing.
        # `^~` rather than a plain prefix: a bare `location /vendor/` loses to
        # the regex above it, because nginx checks regex locations before plain
        # prefix ones. `^~` stops that search on a prefix match, so this block
        # actually applies — and it covers the non-.js files under vendor/ too.
        location ^~ /vendor/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
            add_header Cache-Control "public, max-age=2592000" always;
            access_log off;
        }

        # A static SPA shell: unknown paths fall back to the entry document
        # rather than 404ing, so a deep link or a refresh lands in the app.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
